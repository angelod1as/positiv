<!-- SUPABASE AUTH EMAIL: Reauthentication -->
<!-- Subject: Confirme a reautenticação -->
<!-- Positiv Email Design System - Brand Purple Theme -->

<div style="background: linear-gradient(135deg, #4a75d2 0%, #bf03c3 100%); padding: 40px 20px; font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh;">
  <div style="max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">

    <!-- Logo -->
    <div style="text-align: center; padding: 30px 24px 20px 24px;">
      <img src="https://www.positivparty.com/positiv-logo-colors.png" alt="Positiv" style="max-width: 200px; height: auto; margin: 0 auto; display: block;">
    </div>

    <!-- Content -->
    <div style="padding: 0 30px 30px 30px; text-align: center;">
      <h1 style="font-family: 'DM Sans', Arial, sans-serif; font-size: 28px; font-weight: 800; color: #bf03c3; margin: 0 0 16px 0; line-height: 1.2;">
        Confirme a Reautenticação
      </h1>

      <p style="font-family: 'Nunito', Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333; margin: 0 0 16px 0;">
        Digite o código abaixo para confirmar sua identidade:
      </p>

      <!-- Token Display -->
      <div style="background: #f9f5ff; border: 2px solid #bf03c3; border-radius: 8px; padding: 20px; margin: 0 0 24px 0;">
        <code style="font-family: 'Courier New', monospace; font-size: 24px; font-weight: 700; color: #bf03c3; letter-spacing: 2px;">
          {{ .Token }}
        </code>
      </div>
    </div>

    <!-- Footer -->
    <div style="background: #f9f9f9; padding: 20px; text-align: center; border-top: 1px solid #e0e0e0;">
      <p style="font-family: 'Nunito', Arial, sans-serif; font-size: 14px; color: #666666; margin: 0;">
        <a href="https://www.positivparty.com" style="color: #bf03c3; text-decoration: none; font-weight: 700;">Positiv</a>
      </p>
    </div>

  </div>
</div>

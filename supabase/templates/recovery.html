<div
  style="
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
  "
>
  <div
    style="
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
      margin: auto;
    "
  >
    <img
      src="https://www.positivparty.com/positiv-logo-colors.png"
      alt="Logo"
      style="max-width: 100%; height: auto; margin-bottom: 20px"
    />
    <h2 style="font-family: Arial, sans-serif; color: black">
      Redefinir Senha
    </h2>
    <p style="font-family: Arial, sans-serif; color: black">
      Siga este link para redefinir a senha do seu usuário:
    </p>
    <p>
      <a
        href="{{ .SiteURL }}auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/conta/mudar-senha"
        style="
          display: inline-block;
          padding: 10px 20px;
          margin-top: 20px;
          background-color: black;
          color: white;
          text-decoration: none;
          border-radius: 5px;
          font-family: Arial, sans-serif;
        "
        >Redefinir Senha</a
      >
    </p>
  </div>
</div>

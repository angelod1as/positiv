packages:
  - studio

allowBuilds:
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  core-js: false
  esbuild: true
  puppeteer: true
  supabase: true

# Security floors for transitive dependencies whose parents pin a vulnerable
# version exactly. Each is a same-major bump. Remove an entry once its parent
# ships a fixed range: `pnpm why <package>` shows who still needs it.
overrides:
  # @vercel/frameworks (via sanity's CLI) pins js-yaml 3.13.1 and smol-toml 1.5.2.
  '@vercel/frameworks>js-yaml': ^3.15.2
  '@vercel/frameworks>smol-toml': ^1.7.1
  # chokidar 3 (via @sanity/codegen) resolves picomatch 2.3.1.
  'picomatch@2': ^2.3.2
  # @module-federation/dts-plugin (via sanity's CLI) pins undici 7.29.1.
  '@module-federation/dts-plugin>undici': ^7.30.1

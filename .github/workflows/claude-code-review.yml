name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # The median review takes 3.5 minutes and the slowest genuine one took
    # 15.4, so twenty stops a stuck run without cutting off a slow one.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # A run that finishes without posting has to say why. The report is
          # the readable half; the full output is the half that carries tool
          # results, which is where a failed `gh pr comment` shows up. Both
          # land in a public log, but so does everything this job can reach:
          # Bash is allowlisted to `gh` against this public repository, and a
          # pull request from a fork gets no token and never runs at all.
          display_report: true
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Post the review yourself, in this turn, with `gh pr comment`, before
            you finish. Do not hand the reviewing to background subagents and
            promise to synthesise their findings afterwards: this run is not
            interactive, so it ends when you stop, taking any unfinished agent
            with it. A run of 2026-09-11 did exactly that, spent half a dollar
            and posted nothing, and the job still went green -- a review that
            reviewed nothing is indistinguishable from one that found nothing.

            If you genuinely have no findings, say so in the comment. Finishing
            without commenting is always a bug.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'


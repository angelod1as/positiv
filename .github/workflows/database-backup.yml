name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # daily at 3am UTC
  workflow_dispatch: # manual trigger for testing

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # apt-get update first: the client is not on the runner image, it is
      # fetched every run, and the shipped package index goes stale as the image
      # ages. Installing against a stale index 404s when the mirror has moved on.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump
        env:
          SUPABASE_CONNECT_URL: ${{ secrets.PRODUCTION_SUPABASE_CONNECT_URL }}
        run: |
          FILENAME="backup_$(date +%Y%m%d_%H%M%S).dump"
          pg_dump -Fc "$SUPABASE_CONNECT_URL" -f "$FILENAME"
          echo "DUMP_FILE=$FILENAME" >> "$GITHUB_ENV"

      # The host key is pinned, not discovered. `ssh-keyscan` asks the server
      # for its own key and believes the answer, and known_hosts starts empty on
      # every runner, so there was never a stored key to contradict it. Whoever
      # answered got the dump: a full copy of every profile's name, email, CPF,
      # RG, phone and date of birth. VPS_SSH_KNOWN_HOSTS holds the ed25519 line
      # checked against the fingerprint read on the VPS itself.
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # An unset secret writes an empty known_hosts, and ssh then reports
          # "Host key verification failed." -- the right refusal, worded as
          # though the VPS had changed its key.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is unset"
            exit 1
          fi

          echo "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The likely mistake is pasting the fingerprint -- the output of
          # `ssh-keygen -lf` -- in place of the known_hosts line it was read
          # from. ssh rejects that with "Host key verification failed.", the
          # same words a genuine interception produces.
          if ! ssh-keygen -lf ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not a known_hosts line"
            exit 1
          fi

      - name: Ensure backup directory exists on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_PATH: ${{ secrets.VPS_BACKUP_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_BACKUP_PATH"

      - name: Upload backup via SCP
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_PATH: ${{ secrets.VPS_BACKUP_PATH }}
        run: |
          scp "$DUMP_FILE" "$VPS_USER@$VPS_HOST:$VPS_BACKUP_PATH/$DUMP_FILE"

      - name: Prune backups older than 30 days
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_PATH: ${{ secrets.VPS_BACKUP_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "find $VPS_BACKUP_PATH -name 'backup_*.dump' -mtime +30 -delete"

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Database backup failed*

            Repo: ${{ github.repository }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          format: markdown

name: Deploy Supabase and Test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  workflow_dispatch:

concurrency:
  group: deploy-and-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start Supabase local development setup
        run: |
          for attempt in 1 2 3 4 5; do
            supabase start -x studio,analytics,vector,edge-runtime,imgproxy && exit 0
            echo "supabase start failed (attempt $attempt/5), retrying in 30s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1
      - name: Verify generated types match Postgres schema
        run: |
          supabase gen types typescript --local > schema.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet schema.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
      - name: Stop Supabase local development setup
        run: supabase stop

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # `pnpm lint` regenerates env.d.ts before typechecking, so a stale commit
      # of it is invisible locally. Codegen reads only .env.schema, no values.
      # The icons it fetches from the network are left out of the comparison.
      - name: Check env.d.ts matches .env.schema
        run: |
          pnpm exec varlock codegen
          pnpm exec tsx scripts/check-env-types.ts
      - name: Run unit tests
        run: pnpm test:coverage
      # test:coverage runs the app's Vitest only; the Studio has its own.
      - name: Lint the Studio
        run: pnpm --filter studio lint
      - name: Test the Studio
        run: pnpm --filter studio test
      - name: Build the Studio
        run: pnpm --filter studio build
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # The one place a test talks to Sanity: it reads the published Pages from
  # the production dataset, which is public, so it needs no secrets.
  content-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check production content against the Page contract
        run: pnpm test:contract

  # Coolify builds the image only after a merge, so a Dockerfile that stopped
  # building used to surface as a failed production deploy, weeks later. This
  # builds it on every pull request. The build args are placeholders: the image
  # inlines them into the client bundle, and nothing here ships, so no secret
  # is needed — which also keeps every other secret out of the build layers.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=http://127.0.0.1:54321
            VITE_SUPABASE_ANON_KEY=ci-placeholder-anon-key
            VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA
            VITE_UMAMI_WEBSITE_ID=ci-placeholder-website-id
            VITE_UMAMI_URL=https://umami.example.com
            VITE_GTM_ID=GTM-PLACEHOLDER

  # Deliberately ungated. Waiting on validate-schema and unit-test saved a
  # runner when they failed, but it cost every green pull request their three
  # and a half minutes in series before e2e could start. All three are required
  # checks either way, so a failure still blocks the merge.
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Setup Supabase CLI and start local instance
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start Supabase local instance
        run: |
          for attempt in 1 2 3 4 5; do
            supabase start -x studio,analytics,vector,edge-runtime,imgproxy && exit 0
            echo "supabase start failed (attempt $attempt/5), retrying in 30s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1

      - name: Verify Supabase is running
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if supabase status --output json > /dev/null 2>&1; then
              echo "Supabase is running successfully"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Waiting for Supabase to be ready..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "Supabase failed to start after $max_attempts attempts"
          exit 1

      - name: Get Supabase local credentials
        id: supabase-creds
        run: |
          echo "api_url=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "anon_key=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "service_role_key=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT
          echo "db_url=$(supabase status --output json | jq -r '.DB_URL')" >> $GITHUB_OUTPUT

      # Setup Node and dependencies
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # The install runs on a cache hit too. It costs a couple of seconds when
      # the browser is already there, and skipping it on `cache-hit` is how a
      # partial or stale cache turns into "browser not found" mid-suite.
      # No --with-deps: every library it installs is already the newest
      # version on the runner image, so all it added was nine font packages —
      # 21 MB that apt fetched at 43 kB/s, eight minutes of every run. The
      # suite makes no screenshot assertions, so no font is load-bearing.
      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      # Fail here, with a readable message, when a value is malformed or a
      # required variable has no declaration. APP_ENV=production is what reaches
      # the @required=forEnv(production) items at all; under any other value an
      # empty COOKIE_SECRET or service role key would pass.
      #
      # Read what this does and does not prove. Every value below is supplied
      # here, so the check says the schema is satisfiable — not that the
      # production deploy satisfies it. Production's values live in Coolify and
      # in GitHub secrets, and nothing in this workflow can read Coolify. A
      # variable that is required and missing from the deploy passes here and
      # fails at boot, which is what happened with APP_URL. The guards for that
      # are the Dockerfile healthcheck, the smoke job in production.yml, and the
      # "production value:" lines the schema test requires.
      - name: Validate environment against .env.schema
        run: pnpm env:check
        env:
          APP_ENV: production
          CI: true
          # Not a secret — it is the address the site answers on. It is here
          # because the check runs as production, and production is the shape
          # worth exercising: the origin of a password reset link comes from
          # APP_URL, and production refuses to substitute the request's own Host
          # header for it.
          APP_URL: https://www.positivparty.com
          VITE_SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-creds.outputs.service_role_key }}
          SUPABASE_CONNECT_URL: ${{ steps.supabase-creds.outputs.db_url }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

      # The only place the integration suite runs on every pull request: the
      # pre-push hook no longer reaches the database. It goes first because the
      # database is already migrated here, and its global setup restores the
      # seeded tables it touches, so e2e starts from the same data.
      #
      # APP_URL is what a developer's .env supplies: the payment links are built
      # from it. No Listmonk credentials, ever: without them the client refuses
      # before any request, so the suite cannot reach a real Listmonk.
      - name: Run integration tests
        run: pnpm test:integration
        env:
          CI: true
          APP_URL: http://localhost:5173
          VITE_SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-creds.outputs.service_role_key }}
          SUPABASE_CONNECT_URL: ${{ steps.supabase-creds.outputs.db_url }}

      # Run E2E tests against local Supabase. No Listmonk credentials either:
      # E2E_MODE short-circuits the subscriber and list calls, and the client
      # refuses any non-reserved host during a test run.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-creds.outputs.service_role_key }}
          SUPABASE_CONNECT_URL: ${{ steps.supabase-creds.outputs.db_url }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_ADMIN_EMAIL: ${{ secrets.TEST_USER_ADMIN_EMAIL }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          # Not secrets. The site key is Cloudflare's published "always passes"
          # test key, which the register page needs to render the widget. The
          # secret is never sent: verification from 127.0.0.1 swaps in the test
          # secret itself, so this only satisfies getTurnstileConfig's check
          # that one is set.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          SUPABASE_TURNSTILE_SECRET: ci-placeholder-never-sent

      # Upload artifacts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      # Cleanup
      - name: Stop Supabase local instance
        if: always()
        run: supabase stop

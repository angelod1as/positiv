name: Deploy Supabase and Test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase local development setup
        run: supabase start
      - name: Verify generated types match Postgres schema
        run: |
          supabase gen types typescript --local > schema.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet schema.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
      - name: Stop Supabase local development setup
        run: supabase stop

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # `pnpm lint` regenerates env.d.ts before typechecking, so a stale commit
      # of it is invisible locally. Codegen reads only .env.schema, no values.
      - name: Check env.d.ts matches .env.schema
        run: |
          pnpm exec varlock codegen
          git diff --exit-code env.d.ts
      - name: Run unit tests
        run: pnpm test:coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e-test:
    runs-on: ubuntu-latest
    needs: [validate-schema, unit-test]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Setup Supabase CLI and start local instance
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Verify Supabase is running
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if supabase status --output json > /dev/null 2>&1; then
              echo "Supabase is running successfully"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Waiting for Supabase to be ready..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "Supabase failed to start after $max_attempts attempts"
          exit 1

      - name: Get Supabase local credentials
        id: supabase-creds
        run: |
          echo "api_url=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "anon_key=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "service_role_key=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT
          echo "db_url=$(supabase status --output json | jq -r '.DB_URL')" >> $GITHUB_OUTPUT

      # Setup Node and dependencies
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      # Fail here, with a readable message, when a secret is missing or malformed.
      # APP_ENV=production is what makes this check meaningful: the secrets that
      # matter most are @required=forEnv(production) in the schema, so under any
      # other value an empty COOKIE_SECRET or service role key would pass.
      - name: Validate environment against .env.schema
        run: pnpm env:check
        env:
          APP_ENV: production
          CI: true
          VITE_SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-creds.outputs.service_role_key }}
          SUPABASE_CONNECT_URL: ${{ steps.supabase-creds.outputs.db_url }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

      # Run E2E tests against local Supabase
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-creds.outputs.service_role_key }}
          SUPABASE_CONNECT_URL: ${{ steps.supabase-creds.outputs.db_url }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_ADMIN_EMAIL: ${{ secrets.TEST_USER_ADMIN_EMAIL }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.STAGING_TURNSTILE_SITE_KEY }}
          SUPABASE_TURNSTILE_SECRET: ${{ secrets.STAGING_TURNSTILE_SECRET }}
          LISTMONK_API_URL: ${{ secrets.LISTMONK_API_URL }}
          LISTMONK_API_USERNAME: ${{ secrets.LISTMONK_API_USERNAME }}
          LISTMONK_API_PASSWORD: ${{ secrets.LISTMONK_API_PASSWORD }}

      # Upload artifacts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      # Cleanup
      - name: Stop Supabase local instance
        if: always()
        run: supabase stop

name: Count TODOs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  count-todos:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Find TODOs in PR
        id: find-todos-pr
        run: |
          # Find all TODOs in the PR excluding scripts and .github folders
          find . -type f -not -path "./scripts/*" -not -path "./.github/*" -exec grep -l "// TODO: " {} \; | while read file; do
            grep -n "// TODO: " "$file" | awk -v file="$file" '{print file ":" $0}'
          done > pr_todos.txt || true
          cat pr_todos.txt || echo "No TODOs found in PR"

      - name: Checkout main
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Find TODOs in main
        id: find-todos-main
        run: |
          # Find all TODOs in main excluding scripts and .github folders
          find . -type f -not -path "./scripts/*" -not -path "./.github/*" -exec grep -l "// TODO: " {} \; | while read file; do
            grep -n "// TODO: " "$file" | awk -v file="$file" '{print file ":" $0}'
          done > main_todos.txt || true
          cat main_todos.txt || echo "No TODOs found in main"

      - name: Compare TODOs
        id: compare-todos
        run: |
          # Create normalized files for comparison
          echo "Preparing comparison files..."

          # Process PR TODOs - normalize format for comparison
          if [ -s pr_todos.txt ]; then
            cat pr_todos.txt | sed 's/:.*//' | sort | uniq > pr_files.txt
            for file in $(cat pr_files.txt); do
              grep "^$file:" pr_todos.txt | sed "s|^$file:[0-9]*:|$file:|" | sort > "pr_${file//\//_}.txt"
            done
            cat pr_todos.txt | sort > pr_todos_sorted.txt
          else
            touch pr_todos_sorted.txt
            touch pr_files.txt
          fi

          # Process main TODOs - normalize format for comparison
          if [ -s main_todos.txt ]; then
            cat main_todos.txt | sed 's/:.*//' | sort | uniq > main_files.txt
            for file in $(cat main_files.txt); do
              grep "^$file:" main_todos.txt | sed "s|^$file:[0-9]*:|$file:|" | sort > "main_${file//\//_}.txt"
            done
            cat main_todos.txt | sort > main_todos_sorted.txt
          else
            touch main_todos_sorted.txt
            touch main_files.txt
          fi

          # Create empty files for new and removed TODOs
          > new_todos.txt
          > removed_todos.txt

          # Compare TODOs file by file to handle line number changes
          cat pr_files.txt main_files.txt | sort | uniq > all_files.txt

          for file in $(cat all_files.txt); do
            PR_FILE="pr_${file//\//_}.txt"
            MAIN_FILE="main_${file//\//_}.txt"

            # Create empty files if they don't exist
            touch "$PR_FILE" "$MAIN_FILE"

            # Extract TODO content without line numbers for comparison
            cat "$PR_FILE" 2>/dev/null | sed 's/.*\/\/ TODO: /\/\/ TODO: /' | sort > "pr_content_${file//\//_}.txt" || touch "pr_content_${file//\//_}.txt"
            cat "$MAIN_FILE" 2>/dev/null | sed 's/.*\/\/ TODO: /\/\/ TODO: /' | sort > "main_content_${file//\//_}.txt" || touch "main_content_${file//\//_}.txt"

            # Find new TODOs (in PR but not in main)
            comm -23 "pr_content_${file//\//_}.txt" "main_content_${file//\//_}.txt" | while read todo; do
              grep -F "$todo" "$PR_FILE" >> new_todos.txt
            done

            # Find removed TODOs (in main but not in PR)
            comm -13 "pr_content_${file//\//_}.txt" "main_content_${file//\//_}.txt" | while read todo; do
              grep -F "$todo" "$MAIN_FILE" >> removed_todos.txt
            done
          done

          # Count TODOs
          PR_COUNT=$(cat pr_content_*.txt 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          MAIN_COUNT=$(cat main_content_*.txt 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          NEW_COUNT=$(cat new_todos.txt | wc -l | tr -d ' ')
          REMOVED_COUNT=$(cat removed_todos.txt | wc -l | tr -d ' ')

          # Calculate delta
          DELTA=$((PR_COUNT - MAIN_COUNT))

          # Prepare comment
          if [ $DELTA -eq 0 ] && [ $NEW_COUNT -eq 0 ] && [ $REMOVED_COUNT -eq 0 ]; then
            # No changes
            echo "COMMENT<<EOF" >> $GITHUB_ENV
            echo "TODO Delta: 0 :smile:" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          elif [ $DELTA -gt 0 ]; then
            # More TODOs in PR
            echo "COMMENT<<EOF" >> $GITHUB_ENV
            echo "TODO Delta: +$DELTA :thumbsdown:" >> $GITHUB_ENV
            echo "## New" >> $GITHUB_ENV
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d':' -f1)
              LINE_NUM=$(echo "$line" | cut -d':' -f2)
              TODO_CONTENT=$(echo "$line" | sed 's/.*\/\/ TODO: /- TODO: /')
              echo "$TODO_CONTENT" >> $GITHUB_ENV
            done < new_todos.txt
            echo "EOF" >> $GITHUB_ENV
          elif [ $DELTA -lt 0 ]; then
            # Fewer TODOs in PR
            echo "COMMENT<<EOF" >> $GITHUB_ENV
            echo "TODO Delta: $DELTA :thumbsup:" >> $GITHUB_ENV
            echo "## Removed" >> $GITHUB_ENV
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d':' -f1)
              LINE_NUM=$(echo "$line" | cut -d':' -f2)
              TODO_CONTENT=$(echo "$line" | sed 's/.*\/\/ TODO: /- TODO: /')
              echo "$TODO_CONTENT" >> $GITHUB_ENV
            done < removed_todos.txt
            echo "EOF" >> $GITHUB_ENV
          else
            # Same count but different TODOs
            echo "COMMENT<<EOF" >> $GITHUB_ENV
            echo "TODO Delta: 0 :smile:" >> $GITHUB_ENV

            if [ $NEW_COUNT -gt 0 ]; then
              echo "## New" >> $GITHUB_ENV
              while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d':' -f1)
                LINE_NUM=$(echo "$line" | cut -d':' -f2)
                TODO_CONTENT=$(echo "$line" | sed 's/.*\/\/ TODO: /- TODO: /')
                echo "$TODO_CONTENT" >> $GITHUB_ENV
              done < new_todos.txt
            fi

            if [ $REMOVED_COUNT -gt 0 ]; then
              echo "## Removed" >> $GITHUB_ENV
              while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d':' -f1)
                LINE_NUM=$(echo "$line" | cut -d':' -f2)
                TODO_CONTENT=$(echo "$line" | sed 's/.*\/\/ TODO: /- TODO: /')
                echo "$TODO_CONTENT" >> $GITHUB_ENV
              done < removed_todos.txt
            fi

            echo "EOF" >> $GITHUB_ENV
          fi

          # Output summary for debugging
          echo "PR TODOs: $PR_COUNT"
          echo "Main TODOs: $MAIN_COUNT"
          echo "New TODOs: $NEW_COUNT"
          echo "Removed TODOs: $REMOVED_COUNT"
          echo "Delta: $DELTA"

      - name: Find Comment
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'TODO Delta:'

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.COMMENT }}
          edit-mode: replace
name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run at a time, and a run in progress is never cancelled: it may be in the
# middle of `db push`. GitHub keeps one run waiting behind it; a third merge
# replaces the waiting one, which loses nothing, because the newer run applies
# every pending migration and deploys the newer commit.
concurrency:
  group: production
  cancel-in-progress: false

# Production ships in one order: unit tests, then the migration, then the app,
# then a smoke test against that app. A step that fails stops every step after
# it, so a red main publishes nothing.
#
# Coolify used to deploy the app from its own push webhook, in parallel with
# this workflow and answering to nothing here. POS-520 put an app reading
# integer cents in front of a column still holding reais that way, and WEB-39
# put one reading `access_token` in front of a table without it. Auto-deploy is
# now off in Coolify and `deploy-app` below starts the deployment through its
# API, so the app never reaches production before the schema it needs.
#
# The migration lands before the app, so it must keep working with the app
# already live: expand/contract, as every migration here already does.
jobs:
  unit-test:
    runs-on: ubuntu-latest
    # Stated, so a run that stops making progress fails as a run that took too
    # long rather than as an unexplained cancellation. The suite takes about
    # three minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # Not test:coverage. Instrumenting the suite is worth its cost on a pull
      # request, where deploy-and-test.yml runs it and keeps the artifact; here
      # it only widens the window above.
      - name: Run unit tests
        run: pnpm test:unit

  deploy:
    runs-on: ubuntu-latest
    needs: unit-test
    # The bound is on the steps that can hang, not on the job, and the two are
    # not interchangeable. What needs bounding is the dump: it reaches the
    # network four times and ssh with no ConnectTimeout waits forever, which
    # would hold the gate open in the shape the header describes. What must not
    # be bounded tightly is `db push` -- killing a migration part-way through is
    # worse than a slow gate, and before this job took a timeout at all it had
    # the 360-minute default to run in.
    #
    # So: a short leash on each network step, and a job budget generous enough
    # that a long migration reaches its own end rather than this one. The step
    # leashes total 24 minutes against a 30-minute job, so `db push` is left at
    # least six even if every one of them runs to its limit.
    #
    # This does cap `db push`, which had the 360-minute default before the job
    # took a budget at all. Thirty minutes is wide for the DDL this repository
    # ships. A migration that rewrites a large table could outgrow it, and would
    # fail the same way on every retry -- if you are writing one, raise this
    # number in the same PR rather than discovering the ceiling on merge day.
    timeout-minutes: 30

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
      SUPABASE_CONNECT_URL: ${{ secrets.PRODUCTION_SUPABASE_CONNECT_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # The dump below is the only thing standing between a bad migration and
      # permanent data loss: `db push` runs unattended on every merge, and a
      # migration that drops a column takes the last copy of it with it. The
      # daily backup in database-backup.yml is up to 24 hours stale by the time
      # a merge lands, which is the wrong recovery point for a change nobody is
      # watching.
      #
      # It costs the gate about a minute. That is the trade this file's opening
      # comment is about, and it is worth it here: the failure this guards
      # against is unrecoverable, while a slow gate is merely bad.
      #
      # Named predeploy_* rather than backup_*, so these and the daily dumps
      # prune on their own schedules and one cannot mask the other.
      #
      # The four steps below restate database-backup.yml rather than sharing a
      # composite action with it, on purpose. Factoring them together would put
      # the nightly backup and the deploy gate behind one piece of code, so a
      # change made for this path could stop the backup that runs when nobody
      # is looking. Two copies drift; one copy fails in two places at once, and
      # of those two the drift is the one that gets noticed.
      #
      # No Telegram notification, unlike database-backup.yml, and deliberately.
      # That one runs at 3am with nobody watching, so a silent failure could go
      # unnoticed for days. This one fails in front of whoever just merged, and
      # takes `db push` down with it: the migration does not run, which is the
      # outcome the dump exists to allow. A page would tell someone what the
      # red build already tells them.
      #
      # apt-get update first: the client is not on the runner image, it is
      # fetched every run, and the shipped package index goes stale as the image
      # ages. Installing against a stale index 404s when the mirror has moved
      # on -- a red deploy for a reason that has nothing to do with the merge.
      - name: Install PostgreSQL client
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump production before migrating
        timeout-minutes: 8
        run: |
          FILENAME="predeploy_$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA::7}.dump"
          pg_dump -Fc "$SUPABASE_CONNECT_URL" -f "$FILENAME"
          echo "DUMP_FILE=$FILENAME" >> "$GITHUB_ENV"

      # The host key is pinned, not discovered. `ssh-keyscan` asks the server
      # for its own key and believes the answer, and known_hosts starts empty on
      # every runner, so there was never a stored key to contradict it. Whoever
      # answered got the dump: a full copy of every profile's name, email, CPF,
      # RG, phone and date of birth. VPS_SSH_KNOWN_HOSTS holds the ed25519 line
      # checked against the fingerprint read on the VPS itself.
      #
      # Stored unhashed, where `ssh-keyscan -H` wrote a hashed hostname.
      # Hashing hides which hosts a known_hosts file has visited from whoever
      # steals the file; here the file is one line, on a single-tenant runner,
      # for the length of one job, naming a host the adjacent steps pass to ssh
      # in the clear anyway. What it would cost is the ability to read the
      # secret and see which host it pins.
      - name: Setup SSH
        timeout-minutes: 2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # An unset secret writes an empty known_hosts, and ssh then reports
          # "Host key verification failed." -- the right refusal, worded as
          # though the VPS had changed its key.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is unset"
            exit 1
          fi

          echo "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The likely mistake is pasting the fingerprint -- the output of
          # `ssh-keygen -lf` -- in place of the known_hosts line it was read
          # from. ssh rejects that with "Host key verification failed.", the
          # same words a genuine interception produces.
          if ! ssh-keygen -lf ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not a known_hosts line"
            exit 1
          fi

      - name: Upload the pre-deploy dump
        timeout-minutes: 8
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_PATH: ${{ secrets.VPS_BACKUP_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_BACKUP_PATH"
          scp "$DUMP_FILE" "$VPS_USER@$VPS_HOST:$VPS_BACKUP_PATH/$DUMP_FILE"

      # Same 30 days the daily dumps get. One per merge is a handful a week, so
      # the window costs little and is the one that matters: a schema change
      # noticed late is noticed within weeks, not months.
      - name: Prune pre-deploy dumps older than 30 days
        timeout-minutes: 3
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BACKUP_PATH: ${{ secrets.VPS_BACKUP_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "find $VPS_BACKUP_PATH -name 'predeploy_*.dump' -mtime +30 -delete"

      # --include-all: applies migrations whose timestamps fall before the last
      # migration already on the remote. This happens when a branch with an older
      # timestamp is merged after a newer migration is already deployed to production.
      - run: supabase db push --include-all --db-url "$SUPABASE_CONNECT_URL"

  # Starts the Coolify deployment, only once the migration has run. The token
  # is a Coolify API token with the `deploy` and `read` abilities and nothing
  # else; `read` is for the smoke job, which reads back the deployment.
  #
  # The token reaches curl as a config file on stdin, never as an argument, so
  # it stays out of the process list as well as the log. GitHub masks secrets
  # in the log on its own.
  deploy-app:
    runs-on: ubuntu-latest
    needs: deploy
    # A manual run from another branch migrated that branch's schema, while
    # Coolify would build main. Only main publishes the app.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    outputs:
      deployment_uuid: ${{ steps.start.outputs.deployment_uuid }}

    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      # The Positiv application in Coolify. Not a secret: without the token and
      # the panel's address, which are, it opens nothing.
      COOLIFY_APP_UUID: v4oo4owsw4wgsks40484w4wo

    steps:
      # Coolify builds the head of main, not a commit it is handed. If a newer
      # merge landed while this run waited or migrated, the head carries
      # migrations that have not run yet, and publishing it now is the failure
      # this job exists to prevent. The newer run, queued behind this one,
      # migrates and publishes it.
      - name: Check main still points at this commit
        id: head
        timeout-minutes: 2
        run: |
          # Not piped: under the default `bash -e` a failed ls-remote would be
          # hidden behind the pipe, leave head empty, and read as "main moved",
          # skipping the deploy on a green run.
          remote=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main)
          head=${remote%%[[:space:]]*}

          if [ -z "$head" ]; then
            echo "::error::could not read the head of main"
            exit 1
          fi

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            # A warning, not a notice: if the newer run goes red, this commit's
            # migration is live and its app is not until the next green merge.
            echo "::warning::main moved to $head; the run for that commit publishes the app"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the Coolify deployment
        id: start
        if: steps.head.outputs.current == 'true'
        timeout-minutes: 2
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_DEPLOY_TOKEN" ]; then
            echo "::error::COOLIFY_URL or COOLIFY_DEPLOY_TOKEN is unset"
            exit 1
          fi

          COOLIFY_URL=${COOLIFY_URL%/}

          body=$(printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_DEPLOY_TOKEN" |
            curl -sS --fail-with-body --max-time 60 -K - -X POST \
              "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false")

          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "$body")

          if [ -z "$deployment_uuid" ]; then
            echo "::error::Coolify queued no deployment: $(jq -r '.deployments[0].message // .message // "no message"' <<< "$body")"
            exit 1
          fi

          echo "Coolify deployment $deployment_uuid queued for $GITHUB_SHA"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

  # The Studio is hosted by Sanity (positiv.sanity.studio), not by Coolify, so
  # it deploys from here. It runs beside `deploy`, not after it: the Studio
  # never reads the Postgres schema, and waiting on the dump would only delay
  # it. Schema changes that rename or remove a field still have to follow the
  # expand/contract ADR, because the app and the Studio land at different
  # moments either way.
  deploy-studio:
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 10

    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      # Inlined into the build. Without it the deployed Studio would open
      # development, the local default.
      SANITY_STUDIO_DATASET: production
      # Also inlined into the build. presentation.ts falls back to
      # http://localhost:5173, so without this the hosted Studio frames a laptop
      # that is not running. Coolify never builds the Studio, so it has to be
      # set here, not there. Not a secret.
      SANITY_STUDIO_PREVIEW_ORIGIN: https://www.positivparty.com

    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Deploy the Studio
        run: pnpm --filter studio run deploy

  # Nothing here used to look at the site. A merge that produced an image which
  # could not boot took production down, and the way anyone found out was by
  # opening the page. This is the detector that was missing.
  #
  # A 200 alone proves nothing about this merge: with the Dockerfile
  # healthcheck in place a failed deploy deliberately leaves the previous
  # container serving, and it answers 200. So the first step waits on the
  # deployment `deploy-app` started and checks it built this commit; only then
  # does the site's answer mean the new app is live.
  #
  # Skipped, with `deploy-app`'s publish step, when main moved past this run:
  # the newer run smoke-tests what it publishes.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy-app
    if: needs.deploy-app.outputs.deployment_uuid != ''
    timeout-minutes: 45

    steps:
      # Builds take five to ten minutes; thirty is room for a cold cache and a
      # deployment queued behind another.
      - name: Wait for the Coolify deployment of this commit
        timeout-minutes: 32
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          DEPLOYMENT_UUID: ${{ needs.deploy-app.outputs.deployment_uuid }}
        run: |
          COOLIFY_URL=${COOLIFY_URL%/}

          for attempt in $(seq 1 90); do
            # A blip in the API is not a failed deploy, so it is retried like
            # a deployment still running.
            body=$(printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_DEPLOY_TOKEN" |
              curl -sS --fail-with-body --max-time 20 -K - \
                "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT_UUID") || body='{"status":"unreachable"}'

            status=$(jq -r '.status // "unknown"' <<< "$body")
            commit=$(jq -r '.commit // ""' <<< "$body")

            case "$status" in
              finished)
                if [ "$commit" != "$GITHUB_SHA" ]; then
                  echo "::error::Coolify finished deploying $commit, not $GITHUB_SHA"
                  exit 1
                fi

                echo "deployment of $GITHUB_SHA finished on attempt $attempt"
                exit 0
                ;;
              failed | cancelled-by-user)
                echo "::error::Coolify deployment $DEPLOYMENT_UUID ended $status; the previous app is still serving"
                exit 1
                ;;
            esac

            echo "attempt $attempt: $status"
            sleep 20
          done

          echo "::error::Coolify deployment $DEPLOYMENT_UUID did not finish after 90 checks"
          exit 1

      # Not a secret — it is the address the site answers on.
      - name: Fetch the site until it answers
        env:
          APP_URL: https://www.positivparty.com
        run: |
          for attempt in $(seq 1 30); do
            # curl writes its own 000 on a connection failure and exits
            # non-zero with it, so appending a fallback would log 000 twice
            # while somebody is reading this during an incident. Assigning on
            # failure replaces the value instead of adding to it. Only stdout
            # reaches the substitution, so -S still puts curl's reason for
            # failing in the log next to the code.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL/") || code=000

            if [ "$code" = "200" ]; then
              echo "answered 200 on attempt $attempt"
              exit 0
            fi

            echo "attempt $attempt: $code"
            sleep 20
          done

          echo "::error::$APP_URL never answered 200 after 12 minutes"
          exit 1

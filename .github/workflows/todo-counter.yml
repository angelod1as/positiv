name: TODO Counter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  count_todos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: List TODOs in base branch
        id: list_base
        run: |
          # Create base_todos.txt if it doesn't exist
          touch base_todos.txt
          # Find TODOs and store them in a file
          grep -r --exclude='no-todo-delete.sh' "// TODO:" . > base_todos.txt || true

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: List TODOs in PR branch
        id: list_pr
        run: |
          # Create pr_todos.txt if it doesn't exist
          touch pr_todos.txt
          # Find TODOs and store them in another file
          grep -r --exclude='no-todo-delete.sh' "// TODO:" . > pr_todos.txt || true

      - name: Determine TODO Changes
        id: determine_changes
        run: |
          # Ensure both files exist
          touch base_todos.txt pr_todos.txt

          # Determine the new and removed TODOs
          new_todos=$(comm -13 <(sort base_todos.txt) <(sort pr_todos.txt) || true)
          removed_todos=$(comm -23 <(sort base_todos.txt) <(sort pr_todos.txt) || true)

          echo "new_todos=$(echo "$new_todos" | tr '\n' ' ')" >> $GITHUB_ENV
          echo "removed_todos=$(echo "$removed_todos" | tr '\n' ' ')" >> $GITHUB_ENV

      - name: Add or Update Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          NEW_TODOS: ${{ env.new_todos }}
          REMOVED_TODOS: ${{ env.removed_todos }}
        run: |
          # Construct the comment body
          BODY=$(cat <<EOF
          <!-- TODO-Counter-Comment -->
          **TODO Changes**

          $(if [ ! -z "$NEW_TODOS" ]; then echo "new:"; echo "$NEW_TODOS" | tr ' ' '\n' | sed 's/^/- /'; echo ""; fi)

          $(if [ ! -z "$REMOVED_TODOS" ]; then echo "removed:"; echo "$REMOVED_TODOS" | tr ' ' '\n' | sed 's/^/- /'; echo ""; fi)
          EOF
          )

          # Find the existing comment ID
          comment_id=$(gh api repos/$GH_REPO/issues/$NUMBER/comments --jq ".[] | select(.body | contains(\"<!-- TODO-Counter-Comment -->\")) | .id")

          if [ -n "$comment_id" ]; then
            gh api repos/$GH_REPO/issues/comments/$comment_id -X PATCH -f body="$BODY"
          else
            gh pr comment "$NUMBER" --body "$BODY"
          fi
        shell: bash

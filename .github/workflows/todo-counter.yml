name: TODO Counter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  count_todos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: List TODOs in base branch
        id: list_base
        run: |
          touch base_todos.txt
          grep -r --exclude='no-todo-delete.sh' "// TODO:" . > base_todos.txt || true

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: List TODOs in PR branch
        id: list_pr
        run: |
          touch pr_todos.txt
          grep -r --exclude='no-todo-delete.sh' "// TODO:" . > pr_todos.txt || true

      - name: Determine TODO Changes
        id: determine_changes
        run: |
          # Ensure both files exist
          touch base_todos.txt pr_todos.txt

          # Determine the new TODOs
          new_todos=$(comm -13 <(sort base_todos.txt) <(sort pr_todos.txt) || true)

          # Save the new TODOs as a single line separated by newlines
          echo "new_todos=$(echo "$new_todos" | sed ':a;N;$!ba;s/\n/\\n/g')" >> $GITHUB_ENV

      - name: Calculate Delta
        id: calculate_delta
        run: |
          base_count=$(wc -l < base_todos.txt)
          pr_count=$(wc -l < pr_todos.txt)
          delta=$((pr_count - base_count))
          if [ "$delta" -gt 0 ]; then
            delta_sign="+"
            emoji="👎"
          elif [ "$delta" -lt 0 ]; then
            delta_sign=""
            emoji="👍"
          else
            delta_sign=""
            emoji=""
          fi
          abs_delta=$((delta < 0 ? -delta : delta))
          echo "delta_sign=$delta_sign" >> $GITHUB_ENV
          echo "abs_delta=$abs_delta" >> $GITHUB_ENV
          echo "emoji=$emoji" >> $GITHUB_ENV
          echo "base_count=$base_count" >> $GITHUB_ENV
          echo "pr_count=$pr_count" >> $GITHUB_ENV

      - name: Add or Update Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          NEW_TODOS: ${{ fromJson(env.new_todos) }}
          DELTA_SIGN: ${{ env.delta_sign }}
          ABS_DELTA: ${{ env.abs_delta }}
          EMOJI: ${{ env.emoji }}
          BASE_COUNT: ${{ env.base_count }}
          PR_COUNT: ${{ env.pr_count }}
        run: |
          # Construct the comment body with formatted TODOs
          BODY=$(cat <<EOF
          <!-- TODO-Counter-Comment -->
          **TODO Delta**
          $EMOJI $DELTA_SIGN$ABS_DELTA
          ($BASE_COUNT → $PR_COUNT)

          **TODO Changes**

          $(if [ ! -z "$NEW_TODOS" ]; then
            echo "new:";
            echo "$NEW_TODOS" | tr ' ' '\n' | sed -e 's/^/- /';
          fi)
          EOF
          )

          # Find the existing comment ID
          comment_id=$(gh api repos/$GH_REPO/issues/$NUMBER/comments --jq ".[] | select(.body | contains(\"<!-- TODO-Counter-Comment -->\")) | .id")

          if [ -n "$comment_id" ]; then
            # Update the existing comment
            gh api repos/$GH_REPO/issues/comments/$comment_id -X PATCH -f body="$BODY"
          else
            # Create a new comment if not found
            gh pr comment "$NUMBER" --body "$BODY"
          fi
        shell: bash

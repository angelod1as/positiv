version: 2
updates:
  # pnpm uses the npm ecosystem. The single pnpm-lock.yaml at the root covers
  # studio/ through pnpm-workspace.yaml, so this entry updates both packages:
  # its pull requests edit studio/package.json too.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    # A major needs code changes and a decision, so it never arrives as a
    # weekly bump. Security updates are not version updates and still come.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    # A dependency joins the first group it matches, so the narrow groups come
    # first and the two catch-alls last. Small groups keep each pull request
    # small enough to review and to go green on its own.
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      react-router:
        patterns:
          - react-router
          - "@react-router/*"
      sanity:
        patterns:
          - sanity
          - "@sanity/*"
          - groq-js
      supabase:
        patterns:
          - supabase
          - "@supabase/*"
          - kysely
          - kysely-supabase
          - pg
          - "@types/pg"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      test-tooling:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
          - "@testing-library/*"
          - "@playwright/test"
      lint-tooling:
        patterns:
          - eslint
          - "eslint-*"
          - "@eslint/*"
          - typescript
          - typescript-eslint
          - prettier
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # GitHub raises security alerts against studio/package.json as its own
  # manifest, and without this entry it opens a second, ungrouped pull request
  # for a dependency the root entry already bumps in both packages (#769).
  # Every update for studio/ comes from the root entry instead.
  - package-ecosystem: npm
    directory: "/studio"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # The Dockerfile pins an exact node:24.x.y-alpine tag; this keeps it on the
  # newest 24.x. Moving to the next LTS major is a decision, not a weekly bump.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

<!-- This is a MOCK full template to make sure we have all classes for the possible visual blocks -->
<!-- It's NOT meant to be an usable template -->
<!doctype html>
<html>
  <body>
    <div
      style="
        background-color: #e11d48;
        color: #65a30d;
        font-family:
          Bahnschrift, &quot;DIN Alternate&quot;,
          &quot;Franklin Gothic Medium&quot;, &quot;Nimbus Sans Narrow&quot;,
          sans-serif-condensed, sans-serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.15008px;
        line-height: 1.5;
        margin: 0;
        padding: 32px 0;
        min-height: 100%;
        width: 100%;
      "
    >
      <table
        align="center"
        width="100%"
        style="
          margin: 0 auto;
          max-width: 600px;
          background-color: #4f46e5;
          border-radius: 48px;
          border: 1px solid #0891b2;
        "
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tbody>
          <tr style="width: 100%">
            <td>
              <h1
                style="
                  color: #d97706;
                  background-color: #7c3aed;
                  font-weight: bold;
                  text-align: center;
                  margin: 0;
                  font-size: 32px;
                  padding: 16px 24px 16px 24px;
                "
              >
                Heading
              </h1>
              <h2
                style="
                  font-weight: bold;
                  margin: 0;
                  font-size: 24px;
                  padding: 16px 24px 16px 24px;
                "
              >
                Heading
              </h2>
              <h3
                style="
                  font-weight: bold;
                  margin: 0;
                  font-size: 20px;
                  padding: 16px 24px 16px 24px;
                "
              >
                Heading
              </h3>
              <div style="font-weight: normal; padding: 16px 24px 16px 24px">
                My new text block
              </div>
              <div style="padding: 16px 24px 16px 24px">
                <a
                  href="https://listmonk.app"
                  style="
                    color: #ffffff;
                    font-size: 16px;
                    font-weight: bold;
                    background-color: #999999;
                    border-radius: 4px;
                    display: inline-block;
                    padding: 12px 20px;
                    text-decoration: none;
                  "
                  target="_blank"
                  ><span
                    ><!--[if mso
                      ]><i
                        style="
                          letter-spacing: 20px;
                          mso-font-width: -100%;
                          mso-text-raise: 30;
                        "
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ><span>Button</span
                  ><span
                    ><!--[if mso
                      ]><i
                        style="letter-spacing: 20px; mso-font-width: -100%"
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ></a
                >
              </div>
              <div style="padding: 16px 24px 16px 24px">
                <img
                  alt="Sample product"
                  src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg"
                  style="
                    outline: none;
                    border: none;
                    text-decoration: none;
                    vertical-align: middle;
                    display: inline-block;
                    max-width: 100%;
                  "
                />
              </div>
              <div style="padding: 16px 24px 16px 24px">
                <img
                  alt=""
                  src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png"
                  height="64"
                  width="64"
                  style="
                    outline: none;
                    border: none;
                    text-decoration: none;
                    object-fit: cover;
                    height: 64px;
                    width: 64px;
                    max-width: 100%;
                    display: inline-block;
                    vertical-align: middle;
                    text-align: center;
                    border-radius: 64px;
                  "
                />
              </div>
              <div style="padding: 16px 0px 16px 0px">
                <hr
                  style="
                    width: 100%;
                    border: none;
                    border-top: 1px solid #cccccc;
                    margin: 0;
                  "
                />
              </div>
              <div style="height: 72px"></div>
              <div style="font-size: 16px; padding: 16px 24px 16px 24px">
                <strong>This is an HTML visual block</strong>
              </div>
              <div style="padding: 16px 24px 16px 24px">
                <table
                  align="center"
                  width="100%"
                  cellpadding="0"
                  border="0"
                  style="table-layout: fixed; border-collapse: collapse"
                >
                  <tbody style="width: 100%">
                    <tr style="width: 100%">
                      <td
                        style="
                          box-sizing: content-box;
                          vertical-align: middle;
                          padding-left: 0;
                          padding-right: 10.666666666666666px;
                        "
                      >
                        <div
                          style="
                            font-weight: normal;
                            padding: 16px 24px 16px 24px;
                          "
                        >
                          My new text block
                        </div>
                      </td>
                      <td
                        style="
                          box-sizing: content-box;
                          vertical-align: middle;
                          padding-left: 5.333333333333333px;
                          padding-right: 5.333333333333333px;
                        "
                      >
                        <div
                          style="
                            font-weight: normal;
                            padding: 16px 24px 16px 24px;
                          "
                        >
                          My new text block
                        </div>
                      </td>
                      <td
                        style="
                          box-sizing: content-box;
                          vertical-align: middle;
                          padding-left: 10.666666666666666px;
                          padding-right: 0;
                        "
                      >
                        <div
                          style="
                            font-weight: normal;
                            padding: 16px 24px 16px 24px;
                          "
                        >
                          My new text block
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div style="padding: 16px 24px 16px 24px">
                <div style="font-weight: normal; padding: 16px 24px 16px 24px">
                  My new text block inside the container
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
